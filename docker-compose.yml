services:
  web:
    build: .
    container_name: flight-intelligence
    ports:
      - "8001:8000"
    env_file:
      - .env
    volumes:
      - sqlite_data:/app/data
    command: >
      sh -c "mkdir -p /app/data &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  sqlite_data: